<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Lucide Proxy</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --accent: #007bff;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            padding: 1rem;
            background: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        #proxy-frame {
            flex-grow: 1;
            border: none;
            background: white; /* Most sites render better in white, we can invert if needed */
            width: 100%;
            height: 100%;
        }
        .loader {
            display: none;
            padding: 10px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button onclick="loadUrl()">Go</button>
</div>
<div class="loader" id="loader">Loading...</div>
<iframe id="proxy-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

<script>
    // Using a public CORS proxy. 'api.allorigins.win' is reliable for static content.
    // For sites that need JS execution, an iframe approach with a more complex proxy is needed,
    // but for a single file, we fetch the HTML and write it into the iframe.
    
    const iframe = document.getElementById('proxy-frame');
    const loader = document.getElementById('loader');
    const input = document.getElementById('urlInput');

    // Allow "Enter" key to submit
    input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            loadUrl();
        }
    });

    async function loadUrl() {
        let url = input.value.trim();
        if (!url) return;
        
        // Add https if missing
        if (!url.startsWith('http')) {
            url = 'https://' + url;
        }

        loader.style.display = 'block';
        iframe.style.opacity = '0.5';

        try {
            // Fetch using allorigins (adds JSON wrapper, so we parse it)
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            
            const response = await fetch(proxyUrl);
            
            if (!response.ok) throw new Error("Failed to fetch");
            
            const html = await response.text();
            
            // Inject into iframe
            iframe.srcdoc = html;
            
            // Post-process to strip some common ad scripts (basic heuristic)
            // This is a simple string replacement. For a robust solution, you'd need a server-side parser.
            // We remove common ad network scripts by ID or class if possible, 
            // but since we are client-side, we can only remove DOM elements AFTER load.
            
            iframe.onload = () => {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
                removeAds();
            };

        } catch (err) {
            loader.innerText = "Error: " + err.message;
            iframe.style.opacity = '1';
        }
    }

    function removeAds() {
        // Try to remove common ad elements from the injected DOM
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        
        // Remove common ad selectors
        const adSelectors = [
            'iframe[src*="doubleclick"]',
            'iframe[src*="ads"]',
            'div[class*="ad"]',
            'div[id*="ad"]',
            'div[class*="banner"]',
            'iframe[src*="google"]', // Google ads often
            'script[src*="adsystem"]',
            'script[src*="analytics"]'
        ];

        adSelectors.forEach(selector => {
            try {
                const elements = doc.querySelectorAll(selector);
                elements.forEach(el => {
                    el.remove();
                });
            } catch (e) {
                // Cross-origin iframe might block access if srcdoc isn't fully same-origin
                // But srcdoc is same-origin to the proxy page, so this usually works
            }
        });
    }
</script>

</body>
</html>
