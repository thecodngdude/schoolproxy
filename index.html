<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Fix</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 1rem; background: #252525; border-bottom: 1px solid #333; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        iframe { flex-grow: 1; border: none; background: white; width: 100%; }
        .loader { display: none; padding: 10px; color: #888; }
        .error { display: none; padding: 10px; color: #ff6b6b; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button onclick="loadUrl()">Go</button>
</div>
<div class="loader" id="loader">Loading...</div>
<div class="error" id="errorMsg"></div>
<iframe id="proxy-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>

<script>
    const iframe = document.getElementById('proxy-frame');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const input = document.getElementById('urlInput');

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") loadUrl(); });

    async function loadUrl() {
        let url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;

        loader.style.display = 'block';
        errorMsg.style.display = 'none';
        
        // Use allorigins.win which returns JSON
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error(`Proxy Error: ${response.status}`);
            
            const data = await response.json(); // allorigins returns JSON
            
            if (!data.contents) throw new Error("No content returned");
            
            // Inject the HTML string into the iframe
            iframe.srcdoc = data.contents;
            loader.style.display = 'none';
            
        } catch (err) {
            loader.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.textContent = `Failed: ${err.message}`;
            console.error(err);
        }
    }
</script>

</body>
</html>
