<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Proxy - Octocat Data</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0d1117; color: #58a6ff; padding: 20px; }
        #login { max-width: 400px; margin: 50px auto; text-align: center; }
        input { width: 80%; padding: 10px; margin: 10px 0; background: #161b22; color: #fff; border: 1px solid #30363d; border-radius: 6px; }
        button { padding: 10px 20px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        #content { margin-top: 20px; background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 6px; overflow: auto; max-height: 80vh; }
        #error { color: #ff7b72; margin-top: 10px; }
        pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; color: #79c0ff; }
    </style>
</head>
<body>

    <div id="login">
        <h2>🔒 Git Proxy Lock</h2>
        <input type="password" id="password" placeholder="Enter Password">
        <br>
        <button onclick="unlock()">Unlock</button>
        <div id="error"></div>
    </div>

    <div id="content" style="display:none;">
        <h3>📦 Repository Data (octocat/Hello-World)</h3>
        <pre id="data-output"></pre>
    </div>

    <script>
        const CORRECT_PASSWORD = "wyatt";
        // The URL from the image: API endpoint for octocat/Hello-World
        const TARGET_URL = "https://api.github.com/repos/octocat/Hello-World";

        function unlock() {
            const input = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            if (input === CORRECT_PASSWORD) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                errorDiv.textContent = '';
                
                // Fetch the data
                fetchContent(TARGET_URL);
            } else {
                errorDiv.textContent = '❌ Incorrect password';
            }
        }

        async function fetchContent(url) {
            const output = document.getElementById('data-output');
            output.textContent = "Loading...";
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                // Try to parse as JSON first for nice formatting
                try {
                    const data = await response.json();
                    output.textContent = JSON.stringify(data, null, 2);
                } catch (e) {
                    // If it's not JSON, show as text
                    const text = await response.text();
                    output.textContent = text;
                }

            } catch (err) {
                output.textContent = `Error: ${err.message}`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
